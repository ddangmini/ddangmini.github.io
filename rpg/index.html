<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별빛 소녀 연대기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 폰 세로 화면 하나짜리 앱. 상단 재화 바 + 본문 + 하단 탭. 밤하늘 남색 위에 별빛 금색 한 가지 강조 */
:root{
  --bg:#141a33; --bg2:#1d2547; --panel:#252e57; --line:#3a4578;
  --fg:#eef0ff; --muted:#a3aad6; --gold:#ffcf5a; --rose:#ff8fb1;
  --R:#b7bdd6; --SR:#c4a3ff; --SSR:#ffcf5a;
  --hp:#5fe08f; --hpE:#ff6b7d;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 10%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#fff5 50%,transparent 51%);
  background-attachment:fixed}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top h1{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;color:var(--gold);letter-spacing:.02em;white-space:nowrap}
.res{display:flex;gap:6px;font-variant-numeric:tabular-nums}
.res span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;white-space:nowrap}
#view{flex:1;overflow-y:auto;padding-block:4px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{background:none;border:0;padding:9px 0 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button b{font-size:19px;font-weight:400}
#nav button.on{color:var(--gold)}
body.battling #nav,body.battling #top{display:none}
body.battling #view{padding:0}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:10px 0 8px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:14px 0 8px;color:var(--gold)}
.muted{color:var(--muted);font-size:13px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
.btn.gold{background:linear-gradient(#ffd977,#f0a93a);color:#3a2300;border-color:#ffe39b;font-family:var(--f-display);font-size:17px}
.btn.rose{background:linear-gradient(#ffa9c4,#e8678f);color:#3b0716;border-color:#ffc2d5;font-family:var(--f-display);font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}

/* 홈 */
.stagebox{position:relative;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 110%,#4b3a8a 0%,#252e57 55%,#1d2547 100%);border:1px solid var(--line);height:340px;display:flex;align-items:flex-end;justify-content:center}
.stagebox .leader{width:230px;cursor:pointer;animation:bob 3.2s ease-in-out infinite}
.bubble{position:absolute;top:14px;left:14px;right:14px;background:#fff;color:#2a2142;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5}
.bubble b{color:#c2457a;font-family:var(--f-display);font-weight:400;margin-right:6px}
@keyframes bob{50%{transform:translateY(-6px)}}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats3 div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stats3 b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--gold);font-variant-numeric:tabular-nums}
.stats3 span{font-size:12px;color:var(--muted)}
.home-btns{display:grid;gap:8px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;margin-top:18px;padding:4px}

/* 모험 */
.legend{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted)}
.chap{margin-top:14px}
.chap header{display:flex;justify-content:space-between;align-items:baseline}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-family:var(--f-display);font-size:17px}
.sbtn small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.sbtn.clear{border-color:#5fe08f80}
.sbtn.boss{background:linear-gradient(#4a2547,#2c1d3d);border-color:#ff8fb180}
.sbtn.lock{opacity:.4}

/* 카드 */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{position:relative;background:var(--bg2);border:2px solid var(--R);border-radius:14px;padding:4px 4px 6px;text-align:center;cursor:pointer;overflow:hidden}
.card.SR{border-color:var(--SR)}
.card.SSR{border-color:var(--SSR);box-shadow:0 0 12px #ffcf5a55}
.card .art{aspect-ratio:200/240;max-width:100%;background:radial-gradient(circle at 50% 35%,#ffffff22,transparent 70%)}
.card .art svg{width:100%;height:100%;display:block}
.card .nm{font-family:var(--f-display);font-size:14px;line-height:1.2}
.card .meta{font-size:11px;color:var(--muted)}
.card .rar{position:absolute;top:4px;left:6px;font-family:var(--f-display);font-size:12px}
.card .el{position:absolute;top:3px;right:5px;font-size:13px}
.card.sil .art svg{filter:brightness(0) opacity(.35)}
.card.sil .nm{color:var(--muted)}
.card .pin{position:absolute;bottom:40px;right:4px;background:var(--gold);color:#3a2300;border-radius:999px;font-size:10px;padding:1px 6px;font-family:var(--f-display)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px;font-size:14px}
.tabs button.on{background:var(--gold);color:#3a2300;border-color:var(--gold)}
.rar-R{color:var(--R)}.rar-SR{color:var(--SR)}.rar-SSR{color:var(--SSR)}

/* 상세 */
.detail{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
@media (max-width:380px){.detail{grid-template-columns:1fr}}
.detail .big{background:radial-gradient(circle at 50% 40%,#4b3a8a,#1d2547);border-radius:16px;border:2px solid var(--R)}
.detail .big.SR{border-color:var(--SR)}.detail .big.SSR{border-color:var(--SSR)}
.detail .big svg{width:100%;display:block}
.detail .big.sil svg{filter:brightness(0) opacity(.35)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.skill{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.5}
.skill b{font-family:var(--f-display);font-weight:400;color:var(--rose)}
.stars{color:var(--gold);letter-spacing:2px}
.quote{font-size:14px;color:var(--muted);font-style:italic;margin:6px 0}

/* 편성 */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:200/280;max-width:100%;background:var(--bg2);border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden;cursor:pointer;flex-direction:column}
.slot svg{width:100%;display:block}
.slot .nm{font-family:var(--f-display);font-size:12px;color:var(--fg)}
.power{font-family:var(--f-display);font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}

/* 소환 */
.banner{position:relative;border-radius:18px;overflow:hidden;height:210px;background:linear-gradient(160deg,#2f2363,#5b2c6f 60%,#c2457a);border:1px solid #ffcf5a80}
.banner .trio{position:absolute;bottom:-10px;right:-6px;display:flex}
.banner .trio div{width:110px;margin-left:-38px}
.banner .trio svg{width:100%;display:block}
.banner .txt{position:absolute;left:16px;top:16px;max-width:55%}
.banner .txt h2{margin:0;color:#fff;font-size:24px;line-height:1.15}
.banner .txt p{margin:6px 0 0;font-size:13px;color:#ffe3ee}
.pity{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.pity i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold))}
.rates{font-size:13px;color:var(--muted);line-height:1.7}

/* 모달 */
#overlay{position:fixed;inset:0;background:#0a0d1ecc;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.modal h2{margin-top:0}
.erow-prev{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.erow-prev div{width:64px;text-align:center;font-size:11px;color:var(--muted)}
.erow-prev svg{width:100%;display:block}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:999px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* 소환 연출 */
.gfx{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#2a2160,#0a0d1e);padding:16px}
.gfx .orb{width:120px;height:120px;border-radius:50%;animation:orb 1.1s ease-in forwards}
@keyframes orb{0%{transform:scale(.2);opacity:.2}70%{transform:scale(1.1);opacity:1}100%{transform:scale(6);opacity:0}}
.gres{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:480px}
.gres.one{grid-template-columns:minmax(0,180px);justify-content:center}
.gres .card{animation:flip .45s ease-out both;cursor:default}
.gres .tag{position:absolute;bottom:42px;left:0;right:0;font-size:10px;font-family:var(--f-display);color:var(--gold)}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}

/* 전투 */
.battle{min-height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.bhead .t{font-family:var(--f-display);font-size:17px}
.bhead .row{flex-wrap:nowrap;gap:4px}
.bhead .btn{white-space:nowrap;padding:6px 10px;font-size:13px;border-radius:10px}
.bhead .btn.on{background:var(--gold);color:#3a2300}
.urow{display:flex;justify-content:center;gap:6px}
.unit{position:relative;flex:1;max-width:96px;background:#0007;border:2px solid transparent;border-radius:12px;padding:3px 3px 5px;text-align:center;transition:transform .15s,opacity .3s}
.unit .uart svg{width:100%;display:block}
.unit .un{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpbar{height:6px;background:#0009;border-radius:9px;overflow:hidden;margin-top:2px}
.hpbar i{display:block;height:100%;background:var(--hp);transition:width .3s}
.enemy .hpbar i{background:var(--hpE)}
.unit .ht{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.unit .bf{position:absolute;top:2px;left:3px;font-size:11px;display:flex;gap:1px}
.unit .cdd{position:absolute;top:2px;right:3px;font-size:10px;background:#000a;border-radius:6px;padding:0 4px}
.unit .cdd.ready{background:var(--rose);color:#3b0716}
.unit.active{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 0 14px #ffcf5a66}
.unit.dead{opacity:.25;filter:grayscale(1)}
.unit.tgt{cursor:pointer;border-color:#ff6b7d99;animation:pulse 1s infinite}
@keyframes pulse{50%{border-color:#ff6b7d}}
.unit.hit{animation:hit .3s}
@keyframes hit{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.unit.boss{max-width:150px}
.blog{background:#0008;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.55;min-height:78px;color:#e4e6ff}
.blog div:last-child{color:#fff}
.acts{background:#000a;border-radius:14px;padding:10px;display:grid;gap:8px;margin-top:auto}
.acts .who{font-family:var(--f-display);font-size:15px}
.acts .row .btn{padding:12px 6px}
.acts .btn.sel{outline:2px solid var(--gold)}
.float{position:fixed;transform:translate(-50%,0);font-family:var(--f-display);font-size:22px;pointer-events:none;z-index:70;animation:fl .9s ease-out forwards;text-shadow:0 2px 0 #000,0 0 6px #000}
.float.dmg{color:#fff}.float.crit{color:var(--gold);font-size:28px}.float.heal{color:var(--hp)}.float.weak{color:#ff9f5a}.float.info{color:var(--rose);font-size:16px}
@keyframes fl{to{transform:translate(-50%,-46px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top"><h1>별빛 소녀 연대기</h1><div class="res"><span id="gems"></span><span id="gold"></span></div></header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<div id="overlay"></div>
<div id="toast"></div>
<script>
'use strict';
// ───────── 데이터 ─────────
const EL={fire:{n:'불',c:'#ff7a6b',i:'🔥'},water:{n:'물',c:'#5ab4ff',i:'💧'},wind:{n:'바람',c:'#5fe08f',i:'🍃'},light:{n:'빛',c:'#ffd85a',i:'✨'},dark:{n:'어둠',c:'#b79bff',i:'🌙'}};
const ROLE={attacker:{n:'딜러',hp:.9,atk:1.25,def:.8,spd:1.05},tank:{n:'탱커',hp:1.45,atk:.75,def:1.5,spd:.9},healer:{n:'힐러',hp:1,atk:.9,def:1,spd:1},support:{n:'서포터',hp:1,atk:.95,def:1,spd:1.15}};
const RAR={R:1,SR:1.15,SSR:1.35};
const BEAT={fire:'wind',wind:'water',water:'fire'};
function elemMul(a,d){if(BEAT[a]===d)return 1.5;if(BEAT[d]===a)return .75;if((a==='light'&&d==='dark')||(a==='dark'&&d==='light'))return 1.5;return 1}

// 스킬 type: nuke 단일 / aoe 전체 / multi 무작위 연타 / drain 흡혈 / heal1 최저HP 회복 / healAll 전체 회복 / buffAtk 아군 공격력 / taunt 도발+방어 / debuffDef 적 방어력 감소
const CHARS=[
 {id:'karen',name:'카렌',rar:'SSR',el:'fire',role:'attacker',look:{hair:'#d9303e',eye:'#ffa94d',style:'pony',outfit:'#8f1d2c',acc:'ribbon'},skill:{name:'홍련참',type:'aoe',p:1.8,cd:3},lines:['내 검 앞에 서는 순간, 이미 승부는 끝났어.','훈련 끝나면… 같이 단팥빵 먹을래?']},
 {id:'serena',name:'세레나',rar:'SSR',el:'water',role:'healer',look:{hair:'#a8dbff',eye:'#1c7ed6',style:'long',outfit:'#e3f2ff',acc:'flower'},skill:{name:'성수의 축복',type:'healAll',p:1.3,cd:3},lines:['다치면 숨기지 말고 말해 주세요.','호수의 물소리를 들으면 마음이 편해져요.']},
 {id:'lumiel',name:'루미엘',rar:'SSR',el:'light',role:'support',look:{hair:'#fff1b8',eye:'#f5a300',style:'long',outfit:'#ffffff',acc:'halo'},skill:{name:'여명의 찬가',type:'buffAtk',p:.45,cd:3},lines:['별빛이 당신을 이끌 거예요.','노래는 제일 오래된 마법이랍니다.']},
 {id:'noa',name:'노아',rar:'SSR',el:'dark',role:'attacker',look:{hair:'#5b3cc4',eye:'#ff4f8b',style:'twin',outfit:'#26213a',acc:'horns'},skill:{name:'심연의 송곳',type:'nuke',p:3.3,cd:3},lines:['어둠이 무서워? 난 편한데.','…칭찬해도 아무것도 안 나와.']},
 {id:'sion',name:'시온',rar:'SSR',el:'wind',role:'tank',look:{hair:'#2f9e44',eye:'#c0eb75',style:'bob',outfit:'#d3f9d8',acc:'catears'},skill:{name:'바람의 성벽',type:'taunt',p:1.7,cd:3},lines:['뒤는 맡겨. 아무도 못 지나가.','바람이 바뀌었어. 곧 비가 올 거야.']},
 {id:'haru',name:'하루',rar:'SR',el:'fire',role:'tank',look:{hair:'#ff922b',eye:'#c92a2a',style:'short',outfit:'#fff0e0',acc:'clip'},skill:{name:'불꽃 방패',type:'taunt',p:1.6,cd:3},lines:['맞는 건 내가 할게! 튼튼하거든!','배고프다… 고기 먹으러 가자!']},
 {id:'yuki',name:'유키',rar:'SR',el:'water',role:'attacker',look:{hair:'#eef1f6',eye:'#4dabf7',style:'long',outfit:'#1f6fc0',acc:'catears'},skill:{name:'빙결창',type:'nuke',p:2.7,cd:3},lines:['차갑다는 말, 자주 들어.','…눈 오는 날은 좋아해.']},
 {id:'riko',name:'리코',rar:'SR',el:'wind',role:'healer',look:{hair:'#8ce99a',eye:'#2b8a3e',style:'twin',outfit:'#ffffff',acc:'flower'},skill:{name:'산들바람',type:'heal1',p:2.2,cd:2},lines:['약초 냄새 좋지 않아?','넘어지면 바로 불러!']},
 {id:'ella',name:'엘라',rar:'SR',el:'light',role:'attacker',look:{hair:'#ffe066',eye:'#74c0fc',style:'pony',outfit:'#f8f9ff',acc:'crown'},skill:{name:'섬광 연타',type:'multi',p:.85,hits:4,cd:3},lines:['공주라고 얌전할 줄 알았어?','오늘의 목표는 완벽한 승리!']},
 {id:'beni',name:'베니',rar:'SR',el:'dark',role:'support',look:{hair:'#8a2f9e',eye:'#ffd43b',style:'bob',outfit:'#30293f',acc:'ribbon'},skill:{name:'저주의 안개',type:'debuffDef',p:.35,cd:3},lines:['후후, 약점이 훤히 보이네.','점 봐줄까? 오늘 운세는… 비밀.']},

  <div class="row" style="margin:12px 0"><button class="btn" onclick="gacha(1)" ${S.gems<300?'disabled':''}>1회 소환<br><small>💎 300</small></button><button class="btn gold" onclick="gacha(10)" ${S.gems<3000?'disabled':''}>10회 소환<br><small>💎 3,000</small></button></div>
  <div class="rates"><b class="rar-SSR">SSR 3%</b> ${CHARS.filter(c=>c.rar==='SSR').map(c=>c.name).join(', ')}<br><b class="rar-SR">SR 17%</b> ${CHARS.filter(c=>c.rar==='SR').map(c=>c.name).join(', ')}<br><b class="rar-R">R 80%</b> ${CHARS.filter(c=>c.rar==='R').map(c=>c.name).join(', ')}<br>중복 획득 시 돌파 +1 (최대 5, 레벨 상한 +10). 5돌파 이후 중복은 🪙 2,000으로 바뀝니다.</div>`;
}
function pullOne(forceSR){
  S.pity++;S.pulls++;
  const r=Math.random();let rar=S.pity>=80||r<.03?'SSR':r<.2?'SR':'R';
  if(forceSR&&rar==='R')rar='SR';
  if(rar==='SSR')S.pity=0;
  const pool=CHARS.filter(c=>c.rar===rar),c=pool[Math.random()*pool.length|0],o=S.owned[c.id];
  if(!o){S.owned[c.id]={lv:1,bt:0};const k=S.party.indexOf(null);if(k>=0)S.party[k]=c.id;return{c,tag:'NEW'}}
  if(o.bt<5){o.bt++;return{c,tag:`돌파 ${o.bt}`}}
  S.gold+=2000;return{c,tag:'🪙2000'};
}
function gacha(n){
  const cost=n===10?3000:300;if(S.gems<cost)return toast('💎이 부족해요');
  S.gems-=cost;const res=[];
  for(let k=0;k<n;k++)res.push(pullOne(n===10&&k===9&&res.every(x=>x.c.rar==='R')));
  save();
  const best=res.some(x=>x.c.rar==='SSR')?'SSR':res.some(x=>x.c.rar==='SR')?'SR':'R';
  const col={R:'radial-gradient(#fff,#8fa0d8)',SR:'radial-gradient(#fff,#b38cff)',SSR:'radial-gradient(#fff,#ffcf5a,#ff8fb1)'}[best];
  const g=document.createElement('div');g.className='gfx';g.innerHTML=`<div class="orb" style="background:${col};box-shadow:0 0 60px ${best==='SSR'?'#ffcf5a':'#b38cff'}"></div>`;
  document.body.appendChild(g);
  const show=()=>{if(g.dataset.shown)return;g.dataset.shown=1;
    g.innerHTML=`<div class="gres ${n===1?'one':''}">${res.map((x,k)=>`<div class="card ${x.c.rar}" style="animation-delay:${k*.09}s"><span class="rar rar-${x.c.rar}">${x.c.rar}</span><span class="el">${EL[x.c.el].i}</span><div class="art">${charSVG(x.c)}</div><div class="tag">${x.tag}</div><div class="nm">${x.c.name}</div></div>`).join('')}</div>
    <div class="row" style="margin-top:16px;width:100%;max-width:340px"><button class="btn" id="gclose">확인</button>${S.gems>=cost?`<button class="btn gold" id="gagain">한 번 더 (💎${fmt(cost)})</button>`:''}</div>`;
    g.querySelector('#gclose').onclick=()=>{g.remove();render()};
    const a=g.querySelector('#gagain');if(a)a.onclick=()=>{g.remove();gacha(n)};
  };
  setTimeout(show,1050);g.addEventListener('click',e=>{if(!g.dataset.shown)show()});
  render();
}

  <div class="row" style="margin-top:8px"><button class="btn ${inParty?'':'gold'}" onclick="togglePartyMember('${c.id}');render()">${inParty?'파티에서 빼기':'파티에 넣기'}</button></div>`:''}`;

function levelUp(id,n){

}
function togglePartyMember(id){

}

// ───────── 전투 ─────────
let B=null,uidSeq=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms/(B?B.speed:1)));
function mkUnit(o,side){const u=Object.assign({uid:uidSeq++,side,maxHp:o.hp,cd:0,buffs:[],turns:0},o);u.svg=side==='A'?charSVG(CH[o.id]):enemySVG(o);return u}
const bmul=(u,s)=>u.buffs.filter(b=>b.s===s).reduce((a,b)=>a*b.m,1);
const atkV=u=>u.atk*bmul(u,'atk'),defV=u=>u.def*bmul(u,'def');
const alive=a=>a.filter(u=>u.hp>0);
function startBattle(i){
  const ids=S.party.filter(Boolean);if(!ids.length)return toast('파티를 편성하세요');
  const allies=ids.map(id=>{const o=S.owned[id],c=CH[id];return mkUnit(Object.assign({id,name:c.name,el:c.el,skill:c.skill,role:c.role},stats(id,o.lv,o.bt)),'A')});
  const enemies=stageEnemies(i).map(e=>mkUnit(e,'E'));
  B={idx:i,allies,enemies,round:0,auto:S.auto,speed:S.speed,log:[`${stageLabel(i)} 전투 시작!`],mode:'attack',active:null,resolve:null,busy:false,over:false};
  document.body.classList.add('battling');view='battle';renderBattle();loop(B);
}
function blog(t){B.log.push(t);if(B.log.length>4)B.log.shift()}
function unitHTML(u){
  const me=B.active===u,waiting=B.resolve&&!B.busy&&!B.auto&&B.active&&B.active.side==='A';
  const tgt=waiting&&u.side==='E'&&u.hp>0&&(B.mode==='attack'||B.mode==='skill');
  const bf=[...new Set(u.buffs.map(b=>b.s==='atk'?(b.m>1?'⚔️':''):b.s==='def'?(b.m>1?'🛡️':'💔'):b.s==='taunt'?'🎯':''))].join('');
  return `<div class="unit ${u.side==='E'?'enemy':''} ${u.boss?'boss':''} ${me?'active':''} ${u.hp<=0?'dead':''} ${tgt?'tgt':''}" id="u${u.uid}" onclick="clickUnit(${u.uid})">
  <div class="bf">${bf}</div>${u.side==='A'?`<div class="cdd ${u.cd===0?'ready':''}">${u.cd===0?'스킬':u.cd}</div>`:''}
  <div class="uart">${u.svg}</div><div class="un">${EL[u.el].i}${esc(u.name)}</div><div class="hpbar"><i style="width:${Math.max(0,u.hp/u.maxHp*100)}%"></i></div><div class="ht">${fmt(Math.max(0,u.hp))}</div></div>`;
}
function renderBattle(){
  if(!B)return;
  const a=B.active,mine=a&&a.side==='A'&&B.resolve&&!B.busy;
  let acts;
  if(mine&&!B.auto){
    const sk=a.skill,ready=a.cd===0;
    acts=`<div class="who">${EL[a.el].i} ${a.name}의 차례 <span class="muted">${B.mode==='skill'?'· 스킬 대상을 고르세요':'· 공격할 적을 누르세요'}</span></div>
    <div class="row"><button class="btn ${B.mode==='attack'?'sel':''}" onclick="B.mode='attack';renderBattle()">⚔️ 공격</button><button class="btn rose ${B.mode==='skill'?'sel':''}" onclick="clickSkill()" ${ready?'':'disabled'}>✦ ${sk.name}${ready?'':` (${a.cd})`}</button></div><div class="muted">${SKILL_DESC[sk.type](sk)}</div>`;
  }else acts=`<div class="who">${B.auto&&a&&a.side==='A'?'자동 전투 중…':a?(a.side==='E'?'적의 차례…':'…'):'…'}</div>`;
  $('#view').innerHTML=`<div class="battle" style="background:${CHAPTERS[Math.floor(B.idx/6)].bg}">
   <div class="bhead"><span class="t">${stageLabel(B.idx)} · ${B.round}라운드</span><div class="row"><button class="btn ${B.auto?'on':''}" onclick="toggleAuto()">AUTO</button><button class="btn" onclick="toggleSpeed()">x${B.speed}</button><button class="btn" onclick="askRetreat()">후퇴</button></div></div>
   <div class="urow">${B.enemies.map(unitHTML).join('')}</div>
   <div class="blog">${B.log.map(t=>`<div>${t}</div>`).join('')}</div>
   <div class="urow">${B.allies.map(unitHTML).join('')}</div>
   <div class="acts">${acts}</div></div>`;
}
function fx(u,text,cls){
  const el=document.getElementById('u'+u.uid);if(!el)return;
  const r=el.getBoundingClientRect(),s=document.createElement('div');
  s.className='float '+cls;s.textContent=text;s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height*.3)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),900);
  if(cls!=='heal'&&cls!=='info')el.classList.add('hit');
}
function toggleAuto(){B.auto=!B.auto;S.auto=B.auto;save();renderBattle();if(B.auto&&B.resolve&&!B.busy&&B.active.side==='A')autoAct(B.active)}
function toggleSpeed(){B.speed=B.speed>=3?1:B.speed+1;S.speed=B.speed;save();renderBattle()}
function askRetreat(){modal(`<h2>후퇴할까요?</h2><p class="muted">이번 전투의 보상은 받을 수 없어요.</p><div class="row"><button class="btn" onclick="closeModal()">계속 싸우기</button><button class="btn rose" onclick="closeModal();endBattle(null)">후퇴</button></div>`)}

async function loop(b){
  while(B===b&&!b.over){
    b.round++;
    const order=alive([...b.allies,...b.enemies]).map(u=>[u,u.spd*(.9+Math.random()*.2)]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);
    for(const u of order){
      if(B!==b||b.over)return;
      if(u.hp<=0)continue;
      b.active=u;u.turns++;if(u.cd>0)u.cd--;
      renderBattle();
      if(u.side==='A')await new Promise(res=>{b.resolve=res;b.mode='attack';renderBattle();if(b.auto)setTimeout(()=>autoAct(u),220/b.speed)});
      else{await sleep(380);if(B!==b)return;await enemyAct(u)}
      u.buffs.forEach(x=>x.t--);u.buffs=u.buffs.filter(x=>x.t>0);
      if(!alive(b.enemies).length)return endBattle(true);
      if(!alive(b.allies).length)return endBattle(false);
      await sleep(260);
    }
  }
}
async function act(fn){
  if(!B||B.busy||!B.resolve)return;
  B.busy=true;const b=B;await fn();if(B!==b)return;
  b.busy=false;const r=b.resolve;b.resolve=null;r();
}
function clickUnit(uid){
  if(!B||B.auto||!B.resolve||B.busy)return;
  const a=B.active,t=B.enemies.find(u=>u.uid===uid);
  if(!t||t.hp<=0||a.side!=='A')return;
  if(B.mode==='skill')act(()=>useSkill(a,t));else act(()=>attack(a,t));
}
function clickSkill(){
  const a=B.active;if(!a||a.cd>0||B.busy||!B.resolve)return;
  if(NEEDS_TARGET[a.skill.type]){B.mode='skill';renderBattle()}else act(()=>useSkill(a,null));
}
function pickTarget(a){
  const es=alive(B.enemies);
  return es.sort((x,y)=>elemMul(a.el,y.el)-elemMul(a.el,x.el)||x.hp-y.hp)[0];
}
function autoAct(u){
  if(!B||B.busy||!B.resolve||B.active!==u)return;
  const t=u.skill.type;let useS=u.cd===0;
  if(useS&&t==='heal1')useS=alive(B.allies).some(x=>x.hp/x.maxHp<.7);
  if(useS&&t==='healAll')useS=alive(B.allies).filter(x=>x.hp/x.maxHp<.75).length>=2;
  const tg=pickTarget(u);
  act(()=>useS?useSkill(u,tg):attack(u,tg));
}
function calc(a,d,mul){
  const em=elemMul(a.el,d.el),crit=Math.random()<.12;
  let v=atkV(a)*mul*(100/(100+defV(d)))*em*(.92+Math.random()*.16)*(crit?1.5:1);
  return{v:Math.max(1,Math.round(v)),crit,em};
}
function hurt(a,d,mul){
  const r=calc(a,d,mul);d.hp=Math.max(0,d.hp-r.v);
  return r;
}
function showHit(d,r){fx(d,(r.crit?'치명! ':'')+fmt(r.v),r.crit?'crit':r.em>1?'weak':'dmg')}
function emTxt(r){return r.em>1?' <b style="color:#ff9f5a">효과 굉장!</b>':r.em<1?' <span class="muted">효과 별로…</span>':''}
async function attack(a,d){
  const r=hurt(a,d,1);
  blog(`${a.name}의 공격 → ${esc(d.name)} ${fmt(r.v)}${emTxt(r)}${d.hp<=0?' · 쓰러짐!':''}`);
  renderBattle();showHit(d,r);await sleep(520);
}
async function useSkill(a,t){
  const s=a.skill,foes=a.side==='A'?B.enemies:B.allies,friends=a.side==='A'?B.allies:B.enemies;
  a.cd=s.cd;
  blog(`<b style="color:var(--rose)">✦ ${a.name} 「${s.name}」</b>`);
  const hits=[];
  if(s.type==='nuke'){const d=t&&t.hp>0?t:pickTarget(a);hits.push([d,hurt(a,d,s.p)])}
  else if(s.type==='aoe'){alive(foes).forEach(d=>hits.push([d,hurt(a,d,s.p)]))}
  else if(s.type==='drain'){const d=t&&t.hp>0?t:pickTarget(a),r=hurt(a,d,s.p);hits.push([d,r]);const h=Math.round(r.v*.5);a.hp=Math.min(a.maxHp,a.hp+h);hits.push([a,{heal:h}])}
  else if(s.type==='multi'){
    renderBattle();
    for(let k=0;k<s.hits;k++){const es=alive(foes);if(!es.length)break;const d=es[Math.random()*es.length|0],r=hurt(a,d,s.p);renderBattle();showHit(d,r);await sleep(230)}
    blog(`${s.hits}연타!`);renderBattle();await sleep(300);return;
  }
  else if(s.type==='heal1'){const d=alive(friends).sort((x,y)=>x.hp/x.maxHp-y.hp/y.maxHp)[0],h=Math.round(atkV(a)*s.p);d.hp=Math.min(d.maxHp,d.hp+h);hits.push([d,{heal:h}])}
  else if(s.type==='healAll'){alive(friends).forEach(d=>{const h=Math.round(atkV(a)*s.p);d.hp=Math.min(d.maxHp,d.hp+h);hits.push([d,{heal:h}])})}
  else if(s.type==='buffAtk'){alive(friends).forEach(d=>{d.buffs.push({s:'atk',m:1+s.p,t:2});hits.push([d,{info:'공격↑'}])})}
  else if(s.type==='taunt'){a.buffs.push({s:'taunt',m:1,t:2},{s:'def',m:s.p,t:2});hits.push([a,{info:'도발!'}])}
  else if(s.type==='debuffDef'){alive(foes).forEach(d=>{d.buffs.push({s:'def',m:1-s.p,t:2});hits.push([d,{info:'방어↓'}])})}
  renderBattle();
  hits.forEach(([d,r])=>r.heal!=null?fx(d,'+'+fmt(r.heal),'heal'):r.info?fx(d,r.info,'info'):showHit(d,r));
  const ko=hits.filter(([d,r])=>r.v&&d.hp<=0).length;if(ko)blog(`${ko}명 쓰러짐!`);
  await sleep(650);
}
async function enemyAct(e){
  const as=alive(B.allies);if(!as.length)return;
  if(e.boss&&e.turns%3===0){
    blog(`<b style="color:var(--hpE)">⚠ ${esc(e.name)}의 필살기!</b>`);
    const hs=as.map(d=>[d,hurt(e,d,.8)]);renderBattle();hs.forEach(([d,r])=>showHit(d,r));await sleep(650);return;
  }
  const taunt=as.filter(u=>u.buffs.some(b=>b.s==='taunt'));
  const d=taunt.length?taunt[0]:as[Math.random()*as.length|0];
  await attack(e,d);
}
function endBattle(win){
  const b=B;if(!b||b.over)return;b.over=true;
  if(b.resolve){const r=b.resolve;b.resolve=null;r()}
  if(win===null){B=null;document.body.classList.remove('battling');go('adv');return}
  let html;
  if(win){
    const first=!S.cleared[b.idx],r=stageReward(b.idx,first);
    S.cleared[b.idx]=true;S.gold+=r.gold;S.gems+=r.gems;save();
    const nx=b.idx+1<STAGES?b.idx+1:null;
    html=`<h2 style="color:var(--gold)">승리!</h2><p>${first?'첫 클리어 보상':'반복 보상'}: 🪙 ${fmt(r.gold)} · 💎 ${r.gems}</p>
    ${b.idx===STAGES-1&&first?'<p>그림자 마왕을 쓰러뜨렸어요! 밤하늘에 별빛이 돌아왔습니다. ✨</p>':''}
    <div class="row"><button class="btn" onclick="leaveBattle('adv')">모험 지도</button><button class="btn" onclick="closeModal();startBattle(${b.idx})">다시</button>${nx!==null?`<button class="btn gold" onclick="closeModal();startBattle(${nx})">다음 ${stageLabel(nx)}</button>`:''}</div>`;
  }else{
    html=`<h2 style="color:var(--hpE)">패배…</h2><p class="muted">캐릭터 레벨을 올리거나, 적의 속성에 유리한 캐릭터로 편성해 보세요.</p>
    <div class="row"><button class="btn" onclick="leaveBattle('chars')">강화하러</button><button class="btn" onclick="leaveBattle('party')">편성</button><button class="btn gold" onclick="closeModal();startBattle(${b.idx})">재도전</button></div>`;
  }
  setTimeout(()=>{if(B===b)modal(html)},450);
}
function leaveBattle(v){closeModal();B=null;document.body.classList.remove('battling');go(v)}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay'&&B&&B.over)leaveBattle('adv')},true);

render();
</script>
</body>
</html>
